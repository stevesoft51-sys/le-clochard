name: le_clochard_employe
description: "Application employe Le Clochard (Android, iOS, Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  le_clochard_core:
    path: ../../packages/core
  le_clochard_ui:
    path: ../../packages/ui
  go_router: ^16.2.2
  flutter_riverpod: ^3.0.1
  riverpod_annotation: ^3.0.1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.1
  build_runner: ^2.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.1

flutter:
  uses-material-design: true
